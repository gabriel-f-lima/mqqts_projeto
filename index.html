<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de LEDs MQTT - ESP32</title>
    <link rel="stylesheet" href="index.css">
    <!-- Biblioteca Paho MQTT via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>

</head>
<body>

    <div class="card">
        <h2>Controle IoT ESP32</h2>

        <!-- Grupo Vermelho -->
        <div class="control-group">
            <h3>LED Vermelho</h3>
            <button class="btn-on-red" onclick="ligarVermelho()">LIGAR</button>
            <button class="btn-off-red" onclick="desligarVermelho()">DESLIGAR</button>
        </div>

        <!-- Grupo Verde -->
        <div class="control-group">
            <h3>LED Verde</h3>
            <button class="btn-on-green" onclick="ligarVerde()">LIGAR</button>
            <button class="btn-off-green" onclick="desligarVerde()">DESLIGAR</button>
        </div>
    </div>

    <!-- Importa o arquivo JS -->
    <script src="index.js"></script>
</body>
</html>
